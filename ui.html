<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Figmode</title>
    <style>
      :root {
        color-scheme: light dark;
        --settings-value-width: 100px;
        --settings-revert-width: 30px;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        overflow: hidden;
        height: 100%;
      }

      body {
        margin: 0;
        padding: 7px;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
        font-size: 12px;
        line-height: normal;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .panel {
        display: flex;
        flex-direction: column;
        flex: 1 1 0;
        gap: 5px;
        width: 326px;
        min-height: 0;
      }

      #breadcrumb-host,
      .divider,
      #footer-host {
        flex: 0 0 auto;
      }

      .stack-viewport {
        flex: 1 1 0;
        min-height: 0;
        overflow: hidden;
        position: relative;
      }

      .stack-viewport--scroll {
        overflow-x: hidden;
        overflow-y: auto;
      }

      .stack-stage {
        display: grid;
        grid-template-columns: 100%;
        align-content: start;
      }

      .stack-stage--fill {
        min-height: 100%;
        height: 100%;
      }

      .stack-layer {
        grid-area: 1 / 1;
        min-width: 0;
        background: var(--figma-color-bg);
        align-self: start;
      }

      .stack-stage--fill .stack-layer {
        min-height: 100%;
      }

      .stack-layer.is-front {
        z-index: 1;
      }

      .stack-layer.is-back {
        z-index: 0;
        pointer-events: none;
      }

      .divider {
        background: var(--figma-color-border);
        height: 1px;
        border: 0;
        margin: 0;
        align-self: stretch;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--figma-color-text-secondary);
        font-size: 10px;
        font-weight: 400;
        text-transform: uppercase;
      }

      .breadcrumb-sep {
        width: 4px;
        height: 8px;
        flex-shrink: 0;
        display: block;
        color: var(--figma-color-text-secondary);
      }

      .settings-row {
        display: flex;
        align-items: center;
        width: 100%;
      }

      .settings-row-label {
        flex: 1 1 0;
        min-width: 0;
        font-size: 12px;
        line-height: normal;
        color: var(--figma-color-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .settings-value {
        width: var(--settings-value-width);
        flex-shrink: 0;
      }

      .settings-key-input {
        width: var(--settings-value-width);
        flex-shrink: 0;
        font: inherit;
        font-size: 12px;
        line-height: normal;
        padding: 3px;
        border: 1px solid var(--figma-color-border, #d7d7d7);
        border-radius: 5px;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
      }

      .settings-key-input.recording {
        border-color: var(--figma-color-border-selected);
        color: var(--figma-color-text-secondary);
      }

      .settings-revert-slot {
        width: var(--settings-revert-width);
        flex-shrink: 0;
        display: flex;
        justify-content: center;
      }

      .binding-revert {
        padding: 2px 6px;
        min-width: 24px;
        line-height: 1;
      }

      .binding-revert.is-hidden {
        visibility: hidden;
        pointer-events: none;
      }

      .settings-value.hud-position-fields {
        display: flex;
        gap: 5px;
        width: var(--settings-value-width);
        flex-shrink: 0;
      }

      .hud-position-group {
        display: flex;
        flex: 1 1 0;
        align-items: center;
        gap: 2px;
        min-width: 0;
        overflow: hidden;
      }

      .hud-position-axis {
        flex: 0 0 auto;
        font-size: 12px;
        line-height: normal;
        color: var(--figma-color-text);
      }

      .hud-position-box {
        flex: 1 1 0;
        min-width: 0;
        padding: 3px;
        border: 1px solid var(--figma-color-border, #d7d7d7);
        border-radius: 5px;
        background: var(--figma-color-bg);
        overflow: hidden;
      }

      .hud-position-box input {
        display: block;
        width: 100%;
        min-width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        font: inherit;
        font-size: 12px;
        line-height: normal;
        font-variant-numeric: tabular-nums;
        color: var(--figma-color-text);
      }

      .key-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .key-pill {
        background: var(--figma-color-bg-tertiary);
        border-radius: 5px;
        color: var(--figma-color-text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 400;
        min-width: 30px;
        padding: 3px 5px;
        text-transform: lowercase;
      }

      .key-label {
        color: var(--figma-color-text);
        font-size: 12px;
        font-weight: 400;
        white-space: nowrap;
      }

      .key-label.mode-push {
        font-weight: 700;
      }

      .columns-two {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .column {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .columns-grid {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .alignment-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: 10px;
        row-gap: 5px;
        align-items: center;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .footer {
        display: flex;
        gap: 10px;
        align-items: center;
        line-height: 1;
        margin: 0;
        padding: 0;
      }

      .footer .key-row {
        line-height: 1;
      }

      .footer .key-pill {
        padding: 1px 5px;
        line-height: 16px;
      }

      .footer .key-label {
        line-height: 16px;
      }

      #footer-host {
        line-height: 1;
      }

      .value-mode {
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: flex-start;
      }

      .spacing-mode {
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: flex-start;
      }

      .value-input {
        box-sizing: border-box;
        border: 1px solid var(--figma-color-border);
        border-radius: 10px;
        padding: 6px 12px;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 18px;
        font-weight: 400;
        line-height: normal;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        align-self: flex-start;
        width: 0;
        min-width: 0;
        caret-color: var(--figma-color-text);
        outline: none;
        cursor: text;
      }

      .value-input:focus {
        border-color: var(--figma-color-border-selected);
      }

      .error {
        color: var(--figma-color-text-danger);
        font-size: 11px;
        min-height: 0;
        flex-shrink: 0;
      }

      .error:not(:empty) {
        margin-top: 4px;
        min-height: 14px;
      }

      .capture-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 0;
        height: 0;
      }

      .settings-view {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 4px;
      }

      .binding-list {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .settings-divider {
        background: var(--figma-color-border);
        height: 1px;
        border: 0;
        margin: 4px 0;
        align-self: stretch;
      }

      .settings-actions {
        display: flex;
        gap: 6px;
      }

      button {
        font: inherit;
        font-size: 11px;
        padding: 4px 8px;
        border: 1px solid var(--figma-color-border);
        border-radius: 4px;
        background: var(--figma-color-bg-secondary);
        color: var(--figma-color-text);
        cursor: pointer;
      }

      button.primary {
        background: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
        border-color: transparent;
      }

      .confirm {
        display: none;
        gap: 6px;
        align-items: center;
        font-size: 11px;
        color: var(--figma-color-text);
      }

      .confirm.open {
        display: flex;
      }
    </style>
  </head>
