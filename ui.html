<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Figmode</title>
    <style>
      :root {
        color-scheme: light dark;
        --fm-white: #ffffff;
        --fm-black: #000000;
        --fm-gray: #bfbfbf;
        --fm-dark-gray: #64696e;
        --fm-light-gray: #d7d7d7;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        overflow: hidden;
      }

      body {
        margin: 0;
        padding: 7px;
        background: var(--figma-color-bg, var(--fm-white));
        color: var(--figma-color-text, var(--fm-black));
        font-size: 12px;
        line-height: normal;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .divider {
        background: var(--fm-gray);
        height: 1px;
        border: 0;
        margin: 0;
        align-self: stretch;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--fm-dark-gray);
        font-size: 10px;
        font-weight: 400;
        text-transform: uppercase;
      }

      .breadcrumb-sep {
        width: 4px;
        height: 8px;
        flex-shrink: 0;
      }

      .breadcrumb-sep::before {
        content: "›";
        display: block;
        font-size: 10px;
        line-height: 8px;
        color: var(--fm-dark-gray);
      }

      .key-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .key-pill {
        background: var(--fm-light-gray);
        border-radius: 5px;
        color: var(--fm-black);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 400;
        min-width: 30px;
        padding: 3px 5px;
        text-transform: lowercase;
      }

      .key-label {
        color: var(--fm-black);
        font-size: 12px;
        font-weight: 400;
        white-space: nowrap;
      }

      .key-label.mode-push {
        font-weight: 700;
      }

      .columns-two {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .column {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .columns-grid {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .alignment-grid {
        display: grid;
        grid-template-columns: repeat(3, max-content);
        column-gap: 10px;
        row-gap: 5px;
        align-items: center;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .footer {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .value-display {
        color: var(--fm-black);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 400;
        min-height: 16px;
      }

      .error {
        color: var(--figma-color-text-danger, #f24822);
        font-size: 11px;
        min-height: 14px;
      }

      .capture-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 0;
        height: 0;
      }

      .settings {
        display: none;
        flex-direction: column;
        gap: 8px;
      }

      .settings.open {
        display: flex;
      }

      .settings h2 {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
      }

      .binding-row {
        display: grid;
        grid-template-columns: 1fr 72px;
        gap: 6px;
        align-items: center;
      }

      .binding-row label {
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .binding-row input {
        width: 100%;
        font: inherit;
        font-size: 11px;
        padding: 2px 4px;
        border: 1px solid var(--figma-color-border, var(--fm-gray));
        border-radius: 4px;
        background: var(--figma-color-bg, var(--fm-white));
        color: var(--figma-color-text, var(--fm-black));
      }

      .settings-actions {
        display: flex;
        gap: 6px;
      }

      button {
        font: inherit;
        font-size: 11px;
        padding: 4px 8px;
        border: 1px solid var(--figma-color-border, var(--fm-gray));
        border-radius: 4px;
        background: var(--figma-color-bg-secondary, var(--fm-light-gray));
        color: var(--figma-color-text, var(--fm-black));
        cursor: pointer;
      }

      button.primary {
        background: var(--figma-color-bg-brand, var(--fm-black));
        color: var(--figma-color-text-onbrand, var(--fm-white));
        border-color: transparent;
      }

      .confirm {
        display: none;
        gap: 6px;
        align-items: center;
        font-size: 11px;
      }

      .confirm.open {
        display: flex;
      }

      .panel.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <input
      id="capture"
      class="capture-input"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      aria-label="Figmode keyboard capture"
    />

    <div id="panel" class="panel"></div>

    <div id="settings" class="settings">
      <h2>Settings</h2>
      <div id="binding-list"></div>
      <div class="settings-actions">
        <button id="reset-bindings" type="button">Reset to defaults</button>
        <button id="close-settings" type="button" class="primary">Done</button>
      </div>
      <div id="confirm-reset" class="confirm">
        <span>Reset all key bindings?</span>
        <button id="confirm-reset-yes" type="button" class="primary">Yes</button>
        <button id="confirm-reset-no" type="button">No</button>
      </div>
    </div>

    <div id="error" class="error"></div>

    <script>
      const capture = document.getElementById("capture");
      const panel = document.getElementById("panel");
      const settings = document.getElementById("settings");
      const errorEl = document.getElementById("error");
      const bindingList = document.getElementById("binding-list");
      const confirmReset = document.getElementById("confirm-reset");

      let timeoutMs = 1000;
      let timeoutEnabled = true;
      let timeoutId = null;
      let settingsOpen = false;
      let bindings = [];
      let recordingBindingId = null;
      let lastReportedWidth = 0;
      let lastReportedHeight = 0;

      function post(message) {
        parent.postMessage({ pluginMessage: message }, "*");
      }

      const BODY_PADDING = 14;

      function reportSize() {
        requestAnimationFrame(() => {
          const content = settingsOpen ? settings : panel;
          const width = Math.ceil(Math.max(content.scrollWidth, errorEl.scrollWidth) + BODY_PADDING);
          const height = Math.ceil(
            (settingsOpen ? settings.offsetHeight : panel.offsetHeight) +
              errorEl.offsetHeight +
              BODY_PADDING,
          );
          if (width <= 0 || height <= 0) {
            return;
          }
          if (width === lastReportedWidth && height === lastReportedHeight) {
            return;
          }
          lastReportedWidth = width;
          lastReportedHeight = height;
          post({ type: "ui-resize", width, height });
        });
      }

      function formatKeyFromEvent(event) {
        const parts = [];
        if (event.ctrlKey) parts.push("Ctrl");
        if (event.altKey) parts.push("Alt");
        if (event.metaKey) parts.push("Meta");
        if (event.shiftKey) parts.push("Shift");

        let key = event.key;
        if (key === " ") key = "Space";
        if (key.length === 1) {
          key = key.toLowerCase();
        }

        if (!["Control", "Alt", "Shift", "Meta"].includes(event.key)) {
          parts.push(key);
        }

        return parts.join("+");
      }

      function focusCapture() {
        capture.focus({ preventScroll: true });
      }

      function clearTimer() {
        if (timeoutId !== null) {
          clearTimeout(timeoutId);
          timeoutId = null;
        }
      }

      function armTimer() {
        clearTimer();
        if (!timeoutEnabled || settingsOpen) return;
        timeoutId = setTimeout(() => post({ type: "timeout" }), timeoutMs);
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function renderKeyRow(item) {
        const row = el("div", "key-row");
        row.appendChild(el("span", "key-pill", item.key));
        const label = el("span", item.isModePush ? "key-label mode-push" : "key-label");
        if (item.isModePush) {
          label.textContent = "→ " + item.label;
        } else {
          label.textContent = item.label;
        }
        row.appendChild(label);
        return row;
      }

      function renderBreadcrumb(crumbs) {
        const wrap = el("div", "breadcrumb");
        crumbs.forEach((crumb, index) => {
          if (index > 0) {
            wrap.appendChild(el("span", "breadcrumb-sep"));
          }
          wrap.appendChild(el("span", null, crumb));
        });
        return wrap;
      }

      function renderFooter(footer) {
        const wrap = el("div", "footer");
        footer.forEach((item) => wrap.appendChild(renderKeyRow(item)));
        return wrap;
      }

      function renderUiSpec(uiSpec) {
        panel.replaceChildren();

        if (uiSpec.breadcrumb?.length) {
          panel.appendChild(renderBreadcrumb(uiSpec.breadcrumb));
        }

        if (uiSpec.layout === "twoColumn") {
          const cols = el("div", "columns-two");
          const left = el("div", "column");
          const right = el("div", "column");
          (uiSpec.left || []).forEach((item) => left.appendChild(renderKeyRow(item)));
          (uiSpec.right || []).forEach((item) => right.appendChild(renderKeyRow(item)));
          cols.append(left, right);
          panel.appendChild(cols);
        } else if (uiSpec.layout === "alignmentGrid") {
          const grid = el("div", "alignment-grid");
          (uiSpec.rows || []).forEach((row) => {
            row.forEach((item) => grid.appendChild(renderKeyRow(item)));
          });
          panel.appendChild(grid);
        } else if (uiSpec.layout === "paddingGrid") {
          const cols = el("div", "columns-grid");
          (uiSpec.columns || []).forEach((column) => {
            const col = el("div", "column");
            column.forEach((item) => col.appendChild(renderKeyRow(item)));
            cols.appendChild(col);
          });
          panel.appendChild(cols);
        } else if (uiSpec.layout === "value") {
          const value = el("div", "value-display");
          value.textContent = uiSpec.valueText ?? "";
          panel.appendChild(value);
          const list = el("div", "list");
          (uiSpec.items || []).forEach((item) => list.appendChild(renderKeyRow(item)));
          panel.appendChild(list);
        } else if (uiSpec.items?.length) {
          const list = el("div", "list");
          uiSpec.items.forEach((item) => list.appendChild(renderKeyRow(item)));
          panel.appendChild(list);
        }

        panel.appendChild(el("hr", "divider"));
        panel.appendChild(renderFooter(uiSpec.footer || []));
        reportSize();
      }

      function renderBindings() {
        bindingList.replaceChildren();
        for (const binding of bindings) {
          const row = document.createElement("div");
          row.className = "binding-row";

          const label = document.createElement("label");
          label.textContent = binding.label;
          label.title = binding.label;

          const input = document.createElement("input");
          input.value = binding.key;
          input.readOnly = true;
          input.dataset.bindingId = binding.id;
          input.addEventListener("focus", () => {
            recordingBindingId = binding.id;
            input.value = "Press a key…";
          });
          input.addEventListener("blur", () => {
            if (recordingBindingId === binding.id) {
              recordingBindingId = null;
              input.value = binding.key;
            }
          });

          row.append(label, input);
          bindingList.appendChild(row);
        }
        reportSize();
      }

      function applyState(payload) {
        lastReportedWidth = 0;
        lastReportedHeight = 0;
        settingsOpen = payload.state.settingsOpen;
        errorEl.textContent = "";

        if (payload.uiSpec) {
          renderUiSpec(payload.uiSpec);
        }

        if (settingsOpen) {
          panel.classList.add("hidden");
          settings.classList.add("open");
          clearTimer();
        } else {
          panel.classList.remove("hidden");
          settings.classList.remove("open");
          confirmReset.classList.remove("open");
          armTimer();
          focusCapture();
        }
        reportSize();
      }

      capture.addEventListener("keydown", (event) => {
        event.preventDefault();
        event.stopPropagation();

        if (recordingBindingId) {
          const key = formatKeyFromEvent(event);
          if (["Control", "Alt", "Shift", "Meta"].includes(event.key)) return;
          post({
            type: "settings-update",
            bindingId: recordingBindingId,
            key,
          });
          recordingBindingId = null;
          capture.blur();
          return;
        }

        if (settingsOpen) return;

        const key = formatKeyFromEvent(event);
        if (!key || ["Control", "Alt", "Shift", "Meta"].includes(event.key)) {
          return;
        }

        post({ type: "keydown", key });
        armTimer();
      });

      document.getElementById("close-settings").onclick = () => {
        post({ type: "settings-close" });
        focusCapture();
      };

      document.getElementById("reset-bindings").onclick = () => {
        confirmReset.classList.add("open");
      };

      document.getElementById("confirm-reset-yes").onclick = () => {
        post({ type: "settings-reset" });
        confirmReset.classList.remove("open");
      };

      document.getElementById("confirm-reset-no").onclick = () => {
        confirmReset.classList.remove("open");
      };

      window.addEventListener("blur", () => {
        window.setTimeout(() => {
          if (!document.hasFocus()) {
            post({ type: "close" });
          }
        }, 0);
      });

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        switch (msg.type) {
          case "init":
            timeoutMs = msg.timeoutMs;
            timeoutEnabled = msg.timeoutEnabled;
            bindings = msg.bindings;
            renderBindings();
            applyState(msg);
            focusCapture();
            break;
          case "state":
            if (msg.bindings) {
              bindings = msg.bindings;
              renderBindings();
            }
            applyState(msg);
            break;
          case "close":
            clearTimer();
            break;
          case "error":
            errorEl.textContent = msg.message;
            armTimer();
            focusCapture();
            reportSize();
            break;
          default:
            break;
        }
      };

      post({ type: "ready" });
      focusCapture();
    </script>
  </body>
</html>
