<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Figmode</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        overflow: hidden;
      }

      body {
        margin: 0;
        padding: 7px;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
        font-size: 12px;
        line-height: normal;
      }

      .stack-viewport {
        overflow: hidden;
        position: relative;
        flex: 1;
        min-height: 128px;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 5px;
        width: 326px;
        min-height: 174px;
      }

      .stack-stage {
        display: grid;
        grid-template-columns: 100%;
      }

      .stack-layer {
        grid-area: 1 / 1;
        min-width: 0;
        background: var(--figma-color-bg);
      }

      .stack-layer.is-front {
        z-index: 1;
      }

      .stack-layer.is-back {
        z-index: 0;
      }

      .divider {
        background: var(--figma-color-border);
        height: 1px;
        border: 0;
        margin: 0;
        align-self: stretch;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--figma-color-text-secondary);
        font-size: 10px;
        font-weight: 400;
        text-transform: uppercase;
      }

      .breadcrumb-sep {
        width: 4px;
        height: 8px;
        flex-shrink: 0;
      }

      .breadcrumb-sep::before {
        content: "›";
        display: block;
        font-size: 10px;
        line-height: 8px;
        color: var(--figma-color-text-secondary);
      }

      .key-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .key-pill {
        background: var(--figma-color-bg-tertiary);
        border-radius: 5px;
        color: var(--figma-color-text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 400;
        min-width: 30px;
        padding: 3px 5px;
        text-transform: lowercase;
      }

      .key-label {
        color: var(--figma-color-text);
        font-size: 12px;
        font-weight: 400;
        white-space: nowrap;
      }

      .key-label.mode-push {
        font-weight: 700;
      }

      .columns-two {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .column {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .columns-grid {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .alignment-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: 10px;
        row-gap: 5px;
        align-items: center;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .footer {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .value-mode {
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: flex-start;
      }

      .value-input {
        box-sizing: border-box;
        border: 1px solid var(--figma-color-border);
        border-radius: 10px;
        padding: 6px 12px;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 18px;
        font-weight: 400;
        line-height: normal;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        align-self: flex-start;
        width: 0;
        min-width: 0;
        caret-color: var(--figma-color-text);
        outline: none;
        cursor: text;
      }

      .value-input:focus {
        border-color: var(--figma-color-border-selected);
      }

      .error {
        color: var(--figma-color-text-danger);
        font-size: 11px;
        min-height: 14px;
      }

      .capture-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 0;
        height: 0;
      }

      .settings-view {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .binding-list {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .binding-row {
        display: grid;
        grid-template-columns: 1fr 72px;
        gap: 6px;
        align-items: start;
      }

      .binding-row label {
        font-size: 11px;
        line-height: 1.3;
        white-space: normal;
        color: var(--figma-color-text);
      }

      .settings-divider {
        background: var(--figma-color-border);
        height: 1px;
        border: 0;
        margin: 4px 0;
        align-self: stretch;
      }

      .binding-row input {
        width: 100%;
        font: inherit;
        font-size: 11px;
        padding: 2px 4px;
        border: 1px solid var(--figma-color-border);
        border-radius: 4px;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
      }

      .settings-actions {
        display: flex;
        gap: 6px;
      }

      button {
        font: inherit;
        font-size: 11px;
        padding: 4px 8px;
        border: 1px solid var(--figma-color-border);
        border-radius: 4px;
        background: var(--figma-color-bg-secondary);
        color: var(--figma-color-text);
        cursor: pointer;
      }

      button.primary {
        background: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
        border-color: transparent;
      }

      .confirm {
        display: none;
        gap: 6px;
        align-items: center;
        font-size: 11px;
        color: var(--figma-color-text);
      }

      .confirm.open {
        display: flex;
      }
    </style>
  </head>
  <body>
    <input
      id="capture"
      class="capture-input"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      aria-label="Figmode keyboard capture"
    />

    <div id="panel" class="panel">
      <div id="breadcrumb-host"></div>
      <div id="stack-viewport" class="stack-viewport">
        <div id="stack-stage" class="stack-stage"></div>
      </div>
      <hr class="divider" />
      <div id="footer-host"></div>
    </div>

    <div id="error" class="error"></div>

    <script>
      <!--FIGMODE_UI_BUNDLE-->
    </script>
  </body>
</html>
